[project]
name = "rl"
version = "0.1.0"
description = "Reinforcement Learning course environment"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "gymnasium[atari]",
    "stable-baselines3[extra]>=2.8.0",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "tqdm",
    "tensorboard",
    "wandb",
    "pybullet",
    "ale-py",
    "vizdoom",
    "stable-retro",
    "swanlab>=0.7.18",
]

# PyTorch requires a custom index. For RTX 50-series (Blackwell), use CUDA 13.0+:
#   uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu130
